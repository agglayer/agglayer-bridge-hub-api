# Path to sources
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
#sonar.inclusions=

# Path to tests
#sonar.tests=
#sonar.test.exclusions=
#sonar.test.inclusions=

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclusions for copy-paste detection - exclude repetitive test patterns
sonar.cpd.exclusions=**/fixtures/**,**/mocks/**,**/__tests__/setup.*,**/test-utils/**,**/test-helpers/**,**/config.ts

# Code duplication thresholds
sonar.cpd.ts.minimumTokens=120

# Exclude security hotspots from test files
sonar.security.hotspots.exclusions=**/*test*/**,**/*.test.*,**/*.spec.*,**/tests/**
