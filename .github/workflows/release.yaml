name: Release Packages

on:
    push:
        branches:
            - main
            - release
        paths:
            - "packages/api/**"
            - ".github/workflows/release-api.yml"
            - ".github/workflows/deploy_api_gcp.yaml"

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/create-github-app-token@v1
              id: app-token
              with:
                  app-id: ${{ secrets.SEMANTIC_RELEASE_BOT_APP_ID }}
                  private-key: ${{ secrets.SEMANTIC_RELEASE_BOT_APP_PRIVATE_KEY }}

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}
                  ref: ${{ github.event.inputs.branch || 'main' }}

            - uses: oven-sh/setup-bun@v1

            - name: Install dependencies
              run: bun install

            - name: Build packages
              run: bun run build

            - name: Test packages
              run: bun run test

            - name: Release with Lerna
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  git config --global user.email "semantic-release-bot@users.noreply.github.com"
                  git config --global user.name "Semantic Release Bot"

                  npx lerna version --conventional-commits --create-release github --yes
