name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem statement
          description: What problem are you trying to solve?
          placeholder: "Today it's hard to..."
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: What do you want to happen?
          placeholder: "Add support for..."
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Any other approaches you considered?
      validations:
          required: false

    - type: textarea
      id: additional
      attributes:
          label: Additional context
          description: Links, screenshots, examples, etc.
      validations:
          required: false
